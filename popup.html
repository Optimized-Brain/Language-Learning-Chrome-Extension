<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Language Immersion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 10px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    select, input, button {
      padding: 8px;
      width: 100%;
    }
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .slider {
      width: 100%;
    }
    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider-switch {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider-switch:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider-switch {
      background-color: #2196F3;
    }
    input:checked + .slider-switch:before {
      transform: translateX(26px);
    }
    .word-list {
      height: 150px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 5px;
      margin-top: 10px;
    }
    .word-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
    }
    .word-item:hover {
      background-color: #f5f5f5;
    }
    .debug-section {
      margin-top: 10px;
      padding: 5px;
      border-top: 1px solid #ccc;
    }
    .status {
      color: #4CAF50;
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
    }
    .counter {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Dynamic Language Immersion</h2>
    
    <div class="toggle-container">
      <span>Enable Extension</span>
      <label class="switch">
        <input type="checkbox" id="enableExtension" checked>
        <span class="slider-switch"></span>
      </label>
    </div>

    <div>
      <label for="targetLanguage">Target Language:</label>
      <select id="targetLanguage">
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
      </select>
    </div>

    <div class="slider-container">
      <label for="replacementRate">Replacement Rate: <span id="rateValue">80</span>%</label>
      <input type="range" id="replacementRate" class="slider" min="10" max="100" value="80">
    </div>

    <div class="slider-container">
      <label for="wordDifficulty">Word Difficulty: <span id="difficultyValue">Beginner</span></label>
      <input type="range" id="wordDifficulty" class="slider" min="1" max="3" value="1">
    </div>

    <div>
      <h3>Your Vocabulary List</h3>
      <div class="word-list" id="wordList">
        <!-- Words will be added here dynamically -->
      </div>
    </div>

    <div class="counter" id="replacementCounter">
      Words replaced: 0
    </div>

    <button id="applyButton">Apply Settings</button>
    
    <div class="status" id="status"></div>
    
    <div class="debug-section">
      <button id="debugButton">Force Refresh Page</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
